name: Uptime Monitor

# Lightweight availability check for the deployed services, run on a
# schedule. AWS doesn't ship a hosted uptime monitor out of the box either,
# so this workflow polls the live /health + frontend via
# backend/monitoring/uptime_check.py and fails the job if any target is
# unreachable (which surfaces as a red commit / failure notification).
# Persisted trailing-availability is best effort — the ephemeral Actions
# workspace resets per run, so treat the per-run availability as a
# point-in-time probe, not a long-term SLO store. See
# backend/monitoring/README.md and docs/CHECKLIST.md §10 for the full
# monitoring story (log_aggregate.py does windowed alert thresholds on
# demand).
#
# BACKEND_URL/FRONTEND_URL below are sourced from repo Variables populated
# after `terraform apply` (see infra/README.md Step 6) rather than
# hardcoded literals. uptime_check.py probes whatever URL it's given
# as-is (it never appends /health itself, despite the module docstring's
# phrasing) — BACKEND_URL must be the full /health URL, not just the
# Lambda Function URL's bare domain, or every probe 404s.

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch: {} # allow manual trigger

jobs:
  availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe backend and frontend
        run: python backend/monitoring/uptime_check.py --json
        env:
          # Use the real deployed endpoints (defaults are localhost).
          # LAMBDA_FUNCTION_URL already ends in "/" (AWS's own format), so
          # appending "health" directly (no extra slash) is correct.
          BACKEND_URL: ${{ vars.LAMBDA_FUNCTION_URL }}health
          FRONTEND_URL: https://${{ vars.FRONTEND_CLOUDFRONT_DOMAIN }}
          # Optional. A Slack (or Discord/Teams-compatible) incoming
          # webhook URL — set as a repo Secret to get a push notification
          # on top of the failed-job signal this step already gives.
          # Unset = uptime_check.py's send_alert() is a no-op, unchanged
          # behavior. See backend/monitoring/alert_webhook.py.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
