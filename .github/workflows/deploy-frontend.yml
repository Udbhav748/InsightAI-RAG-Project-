name: Deploy Frontend

# Builds the Vite SPA and syncs it to the S3 bucket CloudFront serves.
# Replaces Vercel's git-integration auto-deploy — AWS has no equivalent
# built-in, so this workflow is the deploy mechanism itself.
#
# VITE_API_KEY ends up embedded verbatim in the built JS bundle regardless
# of whether it's stored as a GitHub secret or variable — that's an
# existing property of this SPA calling an API-key-protected backend
# directly from the browser (true today via frontend/.env too), not a new
# exposure introduced by this workflow. Stored as a secret here only so it
# doesn't appear in plaintext in workflow run logs.

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC — see infra/github_oidc.tf
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # LAMBDA_FUNCTION_URL already includes the https:// scheme and a
          # trailing slash (AWS's own format); axios's baseURL joining
          # handles that trailing slash correctly, no stripping needed.
          VITE_API_BASE_URL: ${{ vars.LAMBDA_FUNCTION_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync build to S3
        run: aws s3 sync dist/ "s3://${{ vars.FRONTEND_BUCKET_NAME }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.FRONTEND_CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
