name: Deploy Backend

# Builds and pushes the backend image to ECR, then points the Lambda
# function at the just-built sha-tagged image. AWS has no equivalent to
# Render's git-push auto-deploy webhook, so this workflow is the deploy
# mechanism itself.
#
# Unlike the superseded ECS design (which mutated a ":latest" tag and
# force-deployed), this pins the function directly to the sha-tagged
# image via --image-uri — simpler, and rollback (infra/README.md) is just
# pointing update-function-code at a different known-good sha.

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC — see infra/github_oidc.tf
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips cleanly (not a failure) until infra/ has actually been applied
    # and these repo Variables populated (infra/README.md Step 6) — avoids
    # a failure-notification email on every push before AWS is provisioned.
    if: ${{ vars.AWS_REGION != '' && vars.AWS_GITHUB_ACTIONS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t "$REGISTRY/insightai-rag-backend:${{ github.sha }}" \
            -t "$REGISTRY/insightai-rag-backend:latest" \
            backend/
          docker push "$REGISTRY/insightai-rag-backend:${{ github.sha }}"
          docker push "$REGISTRY/insightai-rag-backend:latest"

      - name: Update Lambda function code
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "$REGISTRY/insightai-rag-backend:${{ github.sha }}"

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}"
