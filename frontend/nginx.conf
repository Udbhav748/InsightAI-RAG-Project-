server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening headers for the SPA. This is the surface that
    # actually matters for the app's JWT (stored in localStorage — see
    # src/services/api.js): the backend is a JSON API and never renders
    # markup, so a CSP here is what backstops an XSS attempt at reading
    # or exfiltrating that token, not the backend's own (separate) CSP.
    #
    # __API_BASE_ORIGIN__ is substituted at Docker build time (see
    # Dockerfile) with the same VITE_API_BASE_URL the JS bundle itself
    # was built against, so connect-src always matches wherever the
    # frontend actually calls the backend — same-origin deployments and
    # cross-origin ones (the default docker-compose topology: frontend on
    # :8080, backend on :8000) both work without hand-editing this file.
    #
    # script-src has no 'unsafe-inline': the one inline bootstrap script
    # index.html used to carry (the pre-paint theme flash fix) now lives
    # in /theme-init.js instead, specifically so this can stay strict.
    # style-src keeps 'unsafe-inline' — framer-motion (used throughout
    # src/) animates via inline style="" attributes on DOM nodes, which
    # CSP's style-src also gates; there is no framework-level way around
    # that short of a per-request nonce, which a static file server can't
    # generate. worker-src/connect-src allow blob: for pdfjs-dist (renders
    # PDFs via a worker, fetched through a blob: URL — see
    # src/components/chat/PdfPreviewModal.jsx).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: __API_BASE_ORIGIN__; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # react-router's BrowserRouter needs every unknown path to fall back
    # to index.html — otherwise refreshing /chat, /documents, etc. 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
